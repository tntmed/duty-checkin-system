# nginx config for duty-checkin-system
# วางไว้ที่ /etc/nginx/sites-available/dutycheckin
# แล้ว symlink: ln -s /etc/nginx/sites-available/dutycheckin /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name tk.pmk.ac.th;

    # ─── Frontend (React build) ────────────────────────────────
    location /dutycheckin/ {
        alias /var/www/dutycheckin/;
        try_files $uri $uri/ /dutycheckin/index.html;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ─── Backend API ───────────────────────────────────────────
    location /dutycheckin/api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Uploaded files ────────────────────────────────────────
    location /dutycheckin/uploads/ {
        alias /var/www/dutycheckin-uploads/;
    }
}
