<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Embolism Animation</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #2d3436; /* พื้นหลังเข้มเพื่อให้เห็นภาพชัด */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        h2 { margin-bottom: 20px; color: #dfe6e9; }

        .container {
            position: relative;
            width: 600px;
            height: 400px;
        }

        /* --- 1. สร้างรูปทรงสมองด้วย SVG --- */
        .brain-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.5));
        }
        
        /* สีพื้นฐานของสมอง */
        .brain-path {
            fill: #ffcccc; 
            transition: fill 3s ease;
        }

        /* --- 2. หลอดเลือด (Vessel) --- */
        .vessel-track {
            position: absolute;
            top: 55%; /* ปรับตำแหน่งให้อยู่ในเนื้อสมอง */
            left: 10%;
            width: 80%;
            height: 50px;
            background: rgba(0,0,0,0.2); /* สีพื้นหลังหลอดเลือดจางๆ */
            border-radius: 25px;
            overflow: hidden;
            /* ขอบหลอดเลือดแบบนูน */
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.3), 
                        0 1px 0 rgba(255,255,255,0.2);
            z-index: 2;
        }

        /* --- 3. เม็ดเลือดแดง 3D (Red Blood Cells) --- */
        /* ใช้เทคนิค Gradient สร้างภาพลวงตาว่าเป็น 3D */
        .blood-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%; /* กว้างกว่าจอเพื่อเลื่อนได้ */
            height: 100%;
            
            /* สร้าง Pattern เม็ดเลือด 3 มิติ */
            background-image: radial-gradient(circle at 30% 30%, #ff7675 0%, #d63031 40%, #631e1e 100%);
            background-size: 30px 30px; /* ขนาดเม็ดเลือด */
            background-repeat: space repeat;
            
            /* Animation การไหล */
            animation: flow 1s linear infinite;
        }

        /* --- 4. ก้อนลิ่มเลือด (Embolus) แบบขรุขระ --- */
        .embolus {
            position: absolute;
            top: 5px;
            left: -60px;
            width: 40px;
            height: 40px;
            
            /* สีเหลือง/น้ำตาล แสดงถึงคราบไขมันหรือลิ่มเลือดเก่า */
            background: radial-gradient(circle at 40% 40%, #ffeaa7 0%, #fdcb6e 40%, #b7791f 100%);
            
            /*ทำให้รูปร่างเบี้ยวๆ ไม่กลมดิก */
            border-radius: 45% 55% 40% 60% / 50% 60% 40% 50%; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            z-index: 10;

            /* Animation วิ่งไปอุด */
            animation: travelAndBlock 4s ease-out forwards;
        }
        .embolus::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="5" fill="rgba(0,0,0,0.2)"/><circle cx="70" cy="60" r="8" fill="rgba(0,0,0,0.2)"/></svg>');
            border-radius: inherit;
        }

        /* --- 5. พื้นที่สมองขาดเลือด (Ischemia Overlay) --- */
        /* นี่คือแผ่นฟิล์มที่จะซ้อนทับสมองฝั่งขวาเมื่ออุดตัน */
        .ischemia-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        /* ใช้ Clip-path เพื่อระบายสีม่วงเฉพาะส่วนเนื้อสมอง ไม่เลยออกนอกขอบ */
        .ischemia-mask {
            fill: #2d3436; /* สีเทาคล้ำ (Necrosis/Ischemia) */
            opacity: 0;
            mix-blend-mode: multiply; /* ผสมสีกับสีชมพูเดิม */
            animation: tissueDie 3s ease forwards;
            animation-delay: 2.8s;
        }

        /* --- Keyframes --- */
        
        /* เลือดไหล */
        @keyframes flow {
            from { transform: translateX(0); }
            to { transform: translateX(-30px); }
        }

        /* การเดินทางของลิ่มเลือด */
        @keyframes travelAndBlock {
            0% { left: -60px; transform: rotate(0deg); }
            60% { left: 50%; transform: rotate(180deg); } /* วิ่งมาถึงจุดอุดตัน */
            70% { left: 48%; transform: rotate(170deg); } /* แรงดันเลือดดันกลับ */
            100% { left: 50%; transform: rotate(180deg); } /* ค้างที่เดิม */
        }

        /* สมองเปลี่ยนสี */
        @keyframes tissueDie {
            0% { opacity: 0; }
            100% { opacity: 0.7; }
        }
        
        /* หยุดเลือดไหลเมื่ออุดตัน (Optional: ถ้าอยากให้เลือดหยุดนิ่ง) */
        .vessel-track:has(.embolus[style*="animation-play-state: paused"]) .blood-stream {
             animation-play-state: paused;
        }

        /* Label */
        .labels {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: right;
            font-size: 14px;
            color: #ff7675;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #00b894;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,184,148,0.4);
        }
        button:hover { background: #00a884; }

    </style>
</head>
<body>

    <h2>Simulation: Embolic Stroke (ภาวะสมองขาดเลือดจากลิ่มเลือด)</h2>

    <div class="container">
        <svg class="brain-svg" viewBox="0 0 500 350">
            <defs>
                <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffcccc;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ffaaaa;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <path class="brain-path" d="M150,280 C100,280 50,220 50,150 C50,80 120,20 250,20 C380,20 450,80 450,150 C450,220 400,280 350,280 L250,300 L150,280 Z" fill="url(#brainGrad)" stroke="#ff9999" stroke-width="3"/>
            
            <path d="M150,100 Q200,150 250,100 T350,100" fill="none" stroke="#e17055" stroke-width="2" opacity="0.3"/>
            <path d="M100,150 Q150,200 200,150 T300,150" fill="none" stroke="#e17055" stroke-width="2" opacity="0.3"/>

            <path class="ischemia-mask" d="M250,20 L250,300 L350,280 C400,280 450,220 450,150 C450,80 380,20 250,20 Z" />
        </svg>

        <div class="vessel-track">
            <div class="blood-stream"></div> <div class="embolus"></div>    </div>

        <div class="labels">
            <p>Blood Flow (การไหลเวียนเลือด)</p>
            <p style="color:#ffeaa7">Embolus (ลิ่มเลือดหลุดอุดตัน)</p>
        </div>
    </div>

    <button onclick="location.reload()">Replay Animation</button>

</body>
</html>
